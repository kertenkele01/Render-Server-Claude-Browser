# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy with: Render Dashboard → New → Blueprint → pick this repository.
#
# IMPORTANT: the bridge keeps connected devices, paired clients and open MCP
# sessions in memory. Running more than one instance silently breaks it — a
# device's WebSocket lands on instance A while its tool calls land on B.
# Keep numInstances at 1 until the control plane (accounts + shared state)
# exists.

services:
  # ---------------------------------------------------------------------------
  # MCP bridge relay
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-browser-bridge
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      # Unlocks the operator console at "/" and GET /api/status.
      # Render generates a strong value on first deploy; read it from the
      # dashboard under Environment.
      - key: ADMIN_TOKEN
        generateValue: true

      # Set to "true" to drop the console login entirely. Read-only either way,
      # but it publishes paired clients and the hosts the phone visits, so this
      # is an opt-in you make knowingly. sync:false keeps it out of git.
      - key: ADMIN_PUBLIC
        sync: false

      # Origins allowed to call the bridge from a browser and to open a
      # WebSocket. MCP clients are not browsers, so empty is correct unless you
      # deliberately front the bridge with a web app.
      - key: ALLOWED_ORIGINS
        value: ""

      # Crawl4AI powers browser_get_markdown. Set these in the dashboard after
      # the crawl4ai service below is live; sync:false keeps them out of git.
      - key: CRAWL4AI_API_URL
        sync: false
      - key: CRAWL4AI_API_TOKEN
        sync: false

      # --- Persistent state (paid plans only) ---------------------------------
      # The free plan has an ephemeral filesystem, so the device/client registry
      # is rebuilt from scratch after every deploy. It self-heals when the phone
      # reconnects, but the device-identity protection resets in the meantime.
      # To make it durable: switch plan to "starter", uncomment the disk block
      # below and this variable.
      # - key: BRIDGE_STATE_FILE
      #   value: /var/data/bridge-state.json
    # disk:
    #   name: bridge-state
    #   mountPath: /var/data
    #   sizeGB: 1

  # ---------------------------------------------------------------------------
  # Crawl4AI markdown service (optional)
  # The bridge works without it; browser_get_local_markdown is unaffected.
  # Needs more memory than the free plan allows, so it starts on "starter".
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-browser-crawl4ai
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./crawl4ai/Dockerfile
    dockerContext: ./crawl4ai
    healthCheckPath: /health
    numInstances: 1
    envVars:
      # Must match CRAWL4AI_API_TOKEN on the bridge service above.
      - key: CRAWL4AI_API_TOKEN
        generateValue: true
