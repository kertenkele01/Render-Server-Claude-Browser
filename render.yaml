# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy with: Render Dashboard → New → Blueprint → pick this repository.
#
# IMPORTANT: the relay keeps live WebSockets and open MCP sessions in memory.
# Running more than one instance silently breaks it — a device's socket lands on
# instance A while its tool calls land on B. Accounts and the registry are in
# Postgres now, but the sockets cannot be shared, so numInstances stays 1.

services:
  # ---------------------------------------------------------------------------
  # MCP bridge relay
  # ---------------------------------------------------------------------------
  - type: web
    name: ai-browser-bridge
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      # Accounts, devices, clients, claim codes, the audit trail and usage
      # counters. Without it the relay still boots but keeps all of that in a
      # JSON file on an ephemeral disk — every deploy would take the accounts
      # with it. It warns about this at startup and in the panel.
      - key: DATABASE_URL
        fromDatabase:
          name: ai-browser-bridge-db
          property: connectionString

      # Close signups once your own account exists. Leave unset (open) for the
      # first deploy, then set to "false" in the dashboard.
      - key: ALLOW_REGISTRATION
        sync: false

      # Origins allowed to call the bridge from a browser and to open a
      # WebSocket. MCP clients are not browsers, so empty is correct unless you
      # deliberately front the bridge with a web app.
      - key: ALLOWED_ORIGINS
        value: ""

      # Rate-limit ceilings. Defaults live in lib/limits.js; override one only
      # with a reason — a shared office behind a single NAT address is the usual
      # one for LIMIT_REGISTER_MAX.
      # - key: LIMIT_REGISTER_MAX
      #   value: "20"

databases:
  # Render's free Postgres expires after a limited trial period; move it to a
  # paid plan before that if the deployment is more than an experiment. Losing
  # this database means losing accounts and device bindings — the phones keep
  # working and re-announce their clients, but every device shows as unclaimed
  # until its owner claims it again.
  - name: ai-browser-bridge-db
    databaseName: ai_browser_bridge
    user: ai_browser_bridge
    plan: free
    region: frankfurt
